<div *ngIf="!isLoaded" class="text-center justify-center text-gray-400">
  Loading...
</div>

<main [class.hidden]="!isLoaded">

<!-- HEADER -->
  <section>
  <div class="header">
    <div class="header-content">
      <h1>Friend Requests</h1>
      <button class="relative cursor-pointer">
        🔔
        <span class="absolute -top-1 -right-2 bg-red-600 text-white text-xs font-bold
        rounded-full w-5 h-5 flex items-center justify-center"> 1 </span>
      </button>
    </div>
      <p>Manage your incoming friend requests</p>
  </div>
  </section>

<!-- SEARCH -->
  <section>
  <div class="search">
    <app-search-bar
    placeholder="Search friend requests..."
    (search)="searchFriendRequests()">
    </app-search-bar>
  </div>
  </section>

<!-- BUTTONS -->
  <section>
    <div class="tabs">
      <button class="selected">Recieved</button>
      <button class="commingsoon">Pending Requests <span class="text-[10px] bg-gray-700/60 px-2 py-0.5 rounded-md">Coming soon</span>
      </button>
    </div>
  </section>

<!-- FRIEND REQUESTS -->
  <section class="requests" *ngFor="let friendRequest of friendRequestsResponse.content">
    <div class="request-card">
      <img *ngIf="friendRequest.userProfilePicture"
           [src]="getProfilePicture(friendRequest)"/>

      <img *ngIf="!friendRequest.userProfilePicture"
           src="../../../../../assets/profilePicture/default_profile_picture.svg"
           [ngStyle]="{'background-color': friendRequest.profileColor}"/>

      <div class="user-info">
        <h3>{{ friendRequest.username }}</h3>
        <p> Sent {{ friendRequest.createdAt }}</p>
        <div class="details">
          <span [ngClass]="{
          'text-green-500': friendRequest.status === 'ONLINE',
          'text-gray-400': friendRequest.status === 'OFFLINE',
          'text-yellow-400': friendRequest.status === 'AWAY'
          }">• {{ friendRequest.status }} </span>
          <span>• {{ friendRequest.location?.name}}</span>
          <span [ngStyle]="{'color': friendRequest.level?.levelColor}"> • Lvl.{{friendRequest.level?.level}} </span>
        </div>
      </div>
      <div class="actions">
        <button class="accept" (click)=" acceptFriendRequest(friendRequest.userId!) ; $event.stopPropagation()">Accept</button>
        <button class="decline" (click)=" rejectFriendRequest(friendRequest.userId!) ; $event.stopPropagation()">Decline</button>
      </div>
    </div>
  </section>

  <div *ngIf="zeroFriendRequests" class="flex flex-col items-center justify-center h-60text-gray-400">
    <i class="fa-solid fa-envelope text-4xl mb-4"></i>
    <p class="text-lg font-semibold">You don't have any friend requests</p>
  </div>

</main>
