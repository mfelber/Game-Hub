<div *ngIf="!isLoaded" class="text-center justify-center text-gray-400">
  Loading...
</div>

<main [class.hidden]="!isLoaded">

  <!--  SEARCH -->
  <section>
    <div class="top">
      <app-search-bar
        placeholder="Search games..."
        (search)="searchGames($event)">
      </app-search-bar>
      <button class="relative cursor-pointer">
        🔔
        <span class="absolute -top-1 -right-2 bg-red-600 text-white text-xs font-bold
        rounded-full w-5 h-5 flex items-center justify-center"> 1 </span>
      </button>
    </div>

  </section>

  <!-- FILTERS -->
  <section class="filter-bar">
    <div class="filter-header">
      <span>Filters</span>
      <button (click)="resetFilters()">Reset <i class="fa-solid fa-rotate-right text-sm"></i></button>
    </div>

    <div class="filter-options">
      <div class="dropdown">
        <label>Genre</label>
        <select [(ngModel)]="filters.genre" (change)="filterGames()">
          <option value="">All Genres</option>
          <option *ngFor="let genre of allGenres" [value]="genre">{{ genre }}</option>
        </select>
      </div>

      <div class="dropdown">
        <label>Platform</label>
        <select [(ngModel)]="filters.platform" (change)="filterGames()">
          <option value="">All Platforms</option>
          <option *ngFor="let platform of allPlatforms" [value]="platform">{{ platform }}
          </option>
        </select>
      </div>

      <div class="dropdown">
        <label>Price</label>
        <select [(ngModel)]="filters.maxPrice" (change)="filterGames()">
          <option value="">Any Price</option>
          <option [value]="20">≤ 20 €</option>
          <option [value]="50">≤ $50 €</option>
          <option [value]="100">≤ $100 €</option>
          <option [value]="101">≥ 100 €</option>
        </select>
      </div>
    </div>
  </section>

  <!-- GAMES -->
  <section class="games">

    <div class="card relative" *ngFor="let game of filteredGames" (click)="goToGame(game.gameId)">
      <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
      <div class="absolute top-3 right-3 flex flex-col gap-2">
        <div
          *ngIf="gamesOwnedMap?.[game.gameId!]"
          class="bg-green-600/90 text-white text-xs font-semibold px-3 py-1 rounded-full shadow-md">
          <i class="fa-solid fa-check mr-1"></i> Owned
        </div>

        <div
          *ngIf="gameWishListMap?.[game.gameId!] && !gamesOwnedMap?.[game.gameId!]"
          class="bg-pink-600/90 text-white text-xs font-semibold px-3 py-1 rounded-full shadow-md">
          <i class="fa-solid fa-heart mr-1"></i> Wishlist
        </div>
      </div>
      <h3>{{ game.title }}</h3>
      <p>
      <span *ngFor="let genre of game.genres?.slice(0, 2); let last = last">
        {{ genre.name }}<span *ngIf="!last">&nbsp; • &nbsp;</span>
      </span>
      </p>
      <div class="info">
        <div>
          123K <i class="fa-regular fa-thumbs-up text-white"></i>
        </div>
        <strong>{{ game.price }} €</strong>
      </div>
      <button (click)="buyGame(game.gameId) ; $event.stopPropagation() ">
        Buy now || In Library
      </button>
    </div>
  </section>

</main>
