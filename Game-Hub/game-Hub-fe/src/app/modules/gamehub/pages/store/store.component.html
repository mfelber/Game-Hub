<main>

  <!--  SEARCH -->
  <section>
    <div class="top">
      <app-search-bar
        placeholder="Search games..."
        (search)="searchGames($event)">
      </app-search-bar>

      <app-user-actions/>
    </div>

  </section>

  <!-- FILTERS -->
  <section class="filter-bar">
    <div class="filter-header">
      <span>Filters</span>
      <button (click)="resetFilters()">Reset <i class="fa-solid fa-rotate-right text-sm"></i></button>
    </div>

    <div class="filter-options">
      <div class="dropdown">
        <label>Genre</label>
        <select [(ngModel)]="filters.genre" (change)="changeFilter()">
          <option value="">All Genres</option>
          <option *ngFor="let genre of allGenres" [value]="genre">{{ genre }}</option>
        </select>
      </div>

      <div class="dropdown">
        <label>Operation System</label>
        <select [(ngModel)]="filters.operationSystem" (change)="changeFilter()">
          <option value="">All Operation Systems</option>
          <option *ngFor="let platform of allOperationSystems" [value]="platform">{{ platform }}
          </option>
        </select>
      </div>

      <div class="dropdown">
        <label>Price</label>
        <select [(ngModel)]="filters.maxPrice" (change)="changeFilter()">
          <option value="">Any price</option>
          <option value="10">Up to 10 €</option>
          <option value="20">Up to 20 €</option>
          <option value="50">Up to 50 €</option>
          <option value="100">Up to 100 €</option>
        </select>
      </div>

      <div class="checkbox">
        <label>
          <input type="checkbox"
          [(ngModel)]="filters.discount"
          (change)="changeFilter()"> Discount
        </label>
      </div>
    </div>
  </section>

  <app-empty-state
    *ngIf="filteredGames.length === 0 && !isLoading"
    icon='fa-solid fa-gamepad'
    title="No games found"
    message="There are no games matching the selected filters.">
  </app-empty-state>

  <!-- GAMES -->
  <section class="games">

    <div class="loading-overlay" *ngIf="isLoading">
      <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <div class="card relative" *ngFor="let game of filteredGames" (click)="goToGame(game.gameId)">
      <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
      <div class="badges">
        <div
          *ngIf="game.inLibrary"
          class="badge owned-badge">
          Owned <i class="fa-solid fa-check mr-1"></i>
        </div>
        <div *ngIf="game.discountPercent! > 0"
             class="badge discount-badge">-{{ game.discountPercent }} %
        </div>
        <div
          *ngIf="game.inWishList && !game.inLibrary"
          class="badge wishlist-badge">
          Wishlisted <i class="fa-solid fa-heart mr-1"></i>
        </div>
      </div>
      <h3>{{ game.title }}</h3>
      <p>
      <span *ngFor="let genre of game.genres?.slice(0, 2); let last = last">
        {{ genre.name }}<span *ngIf="!last">&nbsp; • &nbsp;</span>
      </span>
      </p>
      <div class="info">
        <div>
          123K <i class="fa-regular fa-thumbs-up text-white"></i>
        </div>
        <div class="price" *ngIf="game.discountPercent! > 0">
          <span class="current-price" [ngClass]="{'free-price' : game.discountPercent === 100}">{{
              game.discountPercent === 100
                ? 'Free'
                : game.discountPrice + ' €'
            }}</span>

          <div class="price-info">
            <span class="old-price"> {{ game.price }} €</span>
          </div>
        </div>
        <div class="price" *ngIf="!game.discountPercent || game.discountPercent <= 0">
          <span class="current-price" [ngClass]="{'free-price' : game.price === 0}">{{
              game.price! > 0 ? (game.price + ' €') : 'Free'
            }} </span>
        </div>
      </div>
      <button *ngIf="!game.inLibrary && !game.inCart" (click)="addToCart(game.gameId) ; $event.stopPropagation()">
        {{ game.price === 0 ? 'Add to Library' : 'Add to Cart' }}
        <i class="fa-solid fa-cart-shopping"></i>
      </button>
      <button *ngIf="game.inLibrary" class="in-library" (click)=" $event.stopPropagation() ">
        In Library <i class="fa-solid fa-gamepad"></i>
      </button>
      <button *ngIf="game.inCart" class="in-cart" (click)=" $event.stopPropagation() ">
        In Cart <i class="fa-solid fa-check"></i>
      </button>
    </div>
  </section>

  <app-pagination
    *ngIf="filteredGames.length && gamePageResponse.totalPages! > 1"
    [currentPage]="page"
    [totalPages]="gamePageResponse.totalPages!"
    (pageChange)="changePage($event)">
  </app-pagination>

</main>
