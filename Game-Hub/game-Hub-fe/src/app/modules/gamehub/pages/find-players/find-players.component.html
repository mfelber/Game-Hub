<app-report-user-modal
  [isOpen]="isReportUserModalOpen"
  [selectedUser]="selectedUserToReport"
  (close)="isReportUserModalOpen = false"
  (submit)="handleReport($event)">
</app-report-user-modal>

<main>

  <!-- HEADER -->
  <section>
    <div class="header">
      <div>
        <h1>Find Players <i class="fa-solid fa-magnifying-glass"></i></h1>
        <p class="page-description">Search for players and add new friends</p>
      </div>
      <app-user-actions/>
    </div>
  </section>

  <!-- SEARCH -->
  <section>
    <div class="search">
      <app-search-bar
        placeholder="Search users..."
        (search)="searchByUsername($event)">
      </app-search-bar>
    </div>
  </section>

  <!-- FILTERS -->
  <section class="filter-bar">
    <div class="filter-header">
      <span>Filters</span>
      <button (click)="resetFilters()"> Reset <i class="fa-solid fa-rotate-right text-sm"></i></button>
    </div>

    <div class="filter-options">

      <div class="dropdown">
        <label>
          Country
        </label>
        <button id="countryDropdownButton"
                data-dropdown-toggle="countryDropdown"
                type="button"
                class="dropdown-button"
        ><span>
          {{ filters.country || 'All Countries' }}
        </span>
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>

        <div id="countryDropdown" class="dropdown-select">
          <ul>
            <li>
              <button type="button"
                      (click)="filters.country = ''; changeFilter(); closeDropdown()"
                      class="dropdown-option">
                All Systems
              </button>
            </li>
            <li *ngFor="let country of allCountries">
              <button
                type="button"
                (click)="filters.country = country; changeFilter(); closeDropdown()"
                class="dropdown-option">
                {{ country }}
              </button>
            </li>
          </ul>
        </div>
      </div>


      <div class="checkbox">
        <label>
          Looking for teammates
        </label>

        <input
          type="checkbox"
          id="teammate-option"
          [(ngModel)]="filters.lookingForTeammate"
          (change)="changeFilter()"
          class="hidden peer">
        <label
          for="teammate-option"
          class="checkbox-label">
          <div class="checkbox-content">
            <i class="fa-solid fa-user-group"></i>
            <span>Wants teammate</span>
          </div>
        </label>
      </div>

      <div class="checkbox">
        <label>
          Voice chat
        </label>

        <input
          type="checkbox"
          id="voicechat-option"
          [(ngModel)]="filters.voiceChat"
          (change)="changeFilter()"
          class="hidden peer">
        <label
          for="voicechat-option"
          class="checkbox-label">
          <div class="checkbox-content">
            <i class="fa-solid fa-microphone"></i>
            <span>Has voice chat</span>
          </div>
        </label>

      </div>
    </div>
  </section>

  <app-empty-state
    *ngIf="filteredUsers.length === 0 && !isLoading"
    icon='fa-solid fa-sad-tear'
    title="No users were founded">
  </app-empty-state>

  <section class="users-cards">

    <app-loading *ngIf="isLoading"/>

    <div class="user-card" (click)="navigateToUser(user.userId)" *ngFor="let user of filteredUsers">
      <div class="left">
        <img *ngIf="user.userProfilePicture"
             [src]="getProfilePicture(user)"
             class="small-img"/>

        <img *ngIf="!user.userProfilePicture"
             src="../../../../../assets/profilePicture/default_profile_picture.svg"
             class="small-img"
             [ngStyle]="{'background-color': user.profileColor}"/>
        <div>
          <div class="username">
            <h3>{{ user.username }}</h3>
            <img class="flag" [src]="user.location?.iconPath" alt="">
          </div>
          <span [ngClass]="{
          'online': user.status === 'Online' || user.status === 'Playing',
          'offline': user.status === 'Offline',
          'away': user.status === 'Away'
          }">• {{
              user.status === 'Playing' ? 'In Game ' + user.currentlyPlaying?.title
                : user.status
            }} </span>
          <div class="stats">
            <span> <i class="fa-solid fa-gamepad library-count"></i> {{ user.libraryCount }}</span>
            <span> <i class="fa-solid fa-user-group friends-count"></i> {{ user.friendsCount }}</span>
            <span> <i class="fa-solid fa-star reviews-count"></i> {{ user.reviewsCount }}</span>
            <span> <i class="fa-solid fa-calendar joined-date"></i> joined {{ user.joinedDate }}</span>
          </div>
        </div>
      </div>
      <div class="right">

        <button *ngIf="user.isFriend" (click)="$event.stopPropagation()"
                class="icon-button is-friend">
          <i class="fa-solid fa-user-group"></i>
        </button>

        <button *ngIf="user.friendRequestReceived"
                (click)=" acceptFriendRequest(user.userId!) ; $event.stopPropagation()"
                class="icon-button accept">
          <i class="fa-solid fa-user-check"></i></button>

        <button *ngIf="user.friendRequestReceived"
                (click)=" rejectFriendRequest(user.userId!) ; $event.stopPropagation()"
                class="icon-button remove">
          <i class="fa-solid fa-user-xmark"></i></button>

        <button
          *ngIf="user.friendRequestSent === false && user.isFriend === false && user.friendRequestReceived === false"
          (click)="sendFriendRequest(user.userId!) ; $event.stopPropagation()"
          class="icon-button accept">
          <i class="fa-solid fa-user-plus"></i>
        </button>

        <button *ngIf="user.friendRequestSent"
                (click)="cancelFriendRequest(user.userId!) ; $event.stopPropagation()"
                class="icon-button cancel-friend">
          <i class="fa-solid fa-user-clock"></i>
        </button>

        <button (click)="openReportUserModal(user) ; $event.stopPropagation()"
                class="icon-button report">
          <i class="fa-solid fa-exclamation"></i>
        </button>
      </div>
    </div>
  </section>

  <app-pagination
    *ngIf="filteredUsers.length && userCommunityResponse.totalPages! > 1"
    [currentPage]="page"
    [totalPages]="userCommunityResponse.totalPages!"
    (pageChange)="changePage($event)">

  </app-pagination>


</main>

<div class="fixed top-4 right-4 flex flex-col gap-2 z-50">
  <div *ngIf="successMessage"
       class="bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg min-w-[250px]
              transform transition-transform duration-500 ease-in-out opacity-0"
       [ngClass]="{'translate-x-0 opacity-100': toastVisible, 'translate-x-24 opacity-0': !toastVisible}">
    {{ successMessage }}
  </div>
</div>
