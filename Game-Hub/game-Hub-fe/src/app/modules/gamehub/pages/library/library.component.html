<div *ngIf="!isLoaded" class="text-center justify-center text-gray-400">
  Loading...
</div>

<main [class.hidden]="!isLoaded">

  <section>
    <div class="header">
      <h1> My Library </h1>
      <app-user-alerts/>
    </div>
  </section>

  <!-- FILTER BUTTONS -->
  <section>
    <div class="tabs">
      <button *ngIf="!loadAllGames" (click)="getOwnedGame()">
        All Games
      </button>

      <button *ngIf="loadAllGames" (click)="getOwnedGame()" class="selected">
        All Games
      </button>

      <button *ngIf="loadFavoriteGames" (click)="getFavoriteGames()" class="selected">
        ⭐ Favorite Games
      </button>

      <button *ngIf="!loadFavoriteGames" (click)="getFavoriteGames()">
        ⭐ Favorite Games
      </button>

<!--        <span class="text-[10px] bg-gray-700/60 px-2 py-0.5 rounded-md">Coming soon</span>-->

      <button class="selected" *ngIf="loadDownloadedGames" (click)="getDownloadedGames()">
        💾 Downloaded Games
      </button>

      <button *ngIf="!loadDownloadedGames" (click)="getDownloadedGames()">
        💾 Downloaded Games
      </button>
    </div>
  </section>

  <!-- SEARCH -->
  <section>
    <div class="search">
      <app-search-bar
        placeholder="Search your games..."
        (search)="searchYourGames($event)">
      </app-search-bar>
    </div>
  </section>

  <app-empty-state
    *ngIf="emptyLibrary && loadAllGames"
    icon = 'fa-solid fa-box-open'
    title="Your library is empty"
    message="Buy or claim free games to see them here!">
  </app-empty-state>

  <app-empty-state
    *ngIf="emptyFavoriteGames && loadFavoriteGames"
    icon = 'fa-solid fa-heart'
    title="No favorite games"
    message="Games you mark as favorite will appear here.">
  </app-empty-state>

  <app-empty-state
    *ngIf="emptyDownloadedGames && loadDownloadedGames"
    icon = 'fa-solid fa-download'
    title="No downloaded  games"
    message="Downloaded games will appear here.">
  </app-empty-state>


  <!-- GAMES -->
  <section class="games" *ngIf="gamePageResponse.content?.length">
    <ng-container *ngIf="loadAllGames">
      <div class="card" *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p *ngIf="!gamesDownloadedMap[game.gameId!]" >Not Installed</p>
          <p *ngIf="gamesDownloadedMap[game.gameId!]"> 💾 Installed</p>
          <small>Played : {{game.playtimeMinutes}}</small>
        </div>
      </div>
      </ng-container>

    <ng-container *ngIf="loadFavoriteGames">
      <div class="card" *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p *ngIf="!gamesDownloadedMap[game.gameId!]" >Not Installed</p>
          <p *ngIf="gamesDownloadedMap[game.gameId!]"> 💾 Installed</p>
          <small>Played : {{game.playtimeMinutes}}</small>
          <button *ngIf="gamesDownloadedMap[game.gameId!]" class="play-btn">
            Play <i class="fa-solid fa-play"></i>
          </button>
          <button *ngIf="!gamesDownloadedMap[game.gameId!]" class="download-btn" (click)="downloadGame(game.gameId); $event.stopPropagation()">
            Download <i class="fa-solid fa-download"></i>
          </button>
          <button class="stop-play-btn">
            Stop playing <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="loadDownloadedGames">
      <div class="card" *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p *ngIf="!gamesDownloadedMap[game.gameId!]" >Not Installed</p>
          <p *ngIf="gamesDownloadedMap[game.gameId!]"> 💾 Installed</p>
          <small>Played : {{game.playtimeMinutes}}</small>
          <button class="play-btn">
            Play <i class="fa-solid fa-play"></i>
          </button>
          <button class="stop-play-btn">
            Stop playing <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
    </ng-container>
  </section>

</main>
