<div *ngIf="!isLoaded" class="text-center justify-center text-gray-400">
  Loading...
</div>

<main [class.hidden]="!isLoaded">

  <section>
    <div class="header">
      <h1> My Library </h1>
      <button class="relative cursor-pointer">
        🔔
        <span class="absolute -top-1 -right-2 bg-red-600 text-white text-xs font-bold
        rounded-full w-5 h-5 flex items-center justify-center"> 1 </span>
      </button>
    </div>
  </section>

  <!-- FILTER BUTTONS -->
  <section>
    <div class="tabs">
      <button *ngIf="!loadAllGames" (click)="getOwnedGame()">
        All Games
      </button>

      <button *ngIf="loadAllGames" (click)="getOwnedGame()" class="selected">
        All Games
      </button>

      <button *ngIf="loadFavoriteGames" (click)="getFavoriteGames()" class="selected">
        ⭐ Favorite Games
      </button>

      <button *ngIf="!loadFavoriteGames" (click)="getFavoriteGames()">
        ⭐ Favorite Games
      </button>

      <button class="commingsoon">
        💾 Downloaded Games
        <span class="text-[10px] bg-gray-700/60 px-2 py-0.5 rounded-md">Coming soon</span>
      </button>
    </div>
  </section>

  <!-- SEARCH -->
  <section>
    <div class="search">
      <app-search-bar
        placeholder="Search your games..."
        (search)="searchYourGames($event)">
      </app-search-bar>
    </div>
  </section>

  <!-- GAMES -->
  <section class="games">
    <ng-container *ngIf="loadAllGames">
      <div class="card" *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p>💾 Installed || Not Installed</p>
          <small>Played : 120h</small>
          <button class="play-btn">
            Play <i class="fa-solid fa-play"></i>
          </button>
          <button class="download-btn">
            Download <i class="fa-solid fa-download"></i>
          </button>
          <button class="stop-play-btn">
            Stop playing <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      </ng-container>

    <ng-container *ngIf="loadFavoriteGames">
      <div class="card"  *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p>💾 Installed || Not Installed</p>
          <small>Played : 120h</small>
          <button>
            Download || Play
          </button>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="loadDownloadedGames">
      <div class="card"  *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p>💾 Installed || Not Installed</p>
          <small>Played : 120h</small>
          <button>
            Download || Play
          </button>
        </div>
      </div>
    </ng-container>
  </section>

  <div *ngIf="emptyLibrary" class="flex flex-col items-center justify-center h-60text-gray-400">
    <i class="fa-solid fa-box-open text-4xl mb-4"></i>
    <p class="text-lg font-semibold">Your library is empty</p>
    <p class="text-sm text-gray-400 mt-1">Start adding some games to see them here!</p>
  </div>

</main>
