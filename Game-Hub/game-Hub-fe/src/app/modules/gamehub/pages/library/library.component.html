<app-playing-warning-modal
  *ngIf="userIsPlayingGame"
  [game]="currentlyPlayingGame"
  (stoppedPlayingGame)="gameStopped()"
  (close)="closeModal()">

</app-playing-warning-modal>


<main>

  <section>
    <div class="header">
      <h1> Library <i class="fa-solid fa-gamepad"></i></h1>
      <app-user-actions/>
    </div>
  </section>

  <!-- SEARCH -->
  <section>
    <div class="search">
      <app-search-bar
        placeholder="Search your games..."
        (search)="searchYourGames($event)">
      </app-search-bar>
    </div>
  </section>

  <!-- FILTER BUTTONS -->
  <section>
    <div class="game-status-filter">
      <div class="game-filter">
        <button class="game-filter-button" [class.active]="activeFilter === 'ALL'" (click)="setFilter('ALL')">
          All Games
        </button>

        <button class="game-filter-button" [class.active]="activeFilter === 'FAVORITE'" (click)="setFilter('FAVORITE')">
          <i class="fa-solid fa-heart"></i> Favorite Games
        </button>

        <button class="game-filter-button" [class.active]="activeFilter === 'DOWNLOADED'"
                (click)="setFilter('DOWNLOADED')">
          <i class="fa-solid fa-download"></i> Downloaded Games
        </button>

      </div>
    </div>
  </section>

  <app-empty-state
    *ngIf="emptyLibrary && loadAllGames"
    icon='fa-solid fa-box-open'
    title="Your library is empty"
    message="Buy or claim free games to see them here!">
  </app-empty-state>

  <app-empty-state
    *ngIf="emptyFavoriteGames && loadFavoriteGames"
    icon='fa-solid fa-heart'
    title="No favorite games"
    message="Games you mark as favorite will appear here.">
  </app-empty-state>

  <app-empty-state
    *ngIf="emptyDownloadedGames && loadDownloadedGames"
    icon='fa-solid fa-download'
    title="No downloaded  games"
    message="Downloaded games will appear here.">
  </app-empty-state>


  <!-- GAMES -->
  <section class="games" *ngIf="gamePageResponse.content?.length">

    <div class="loading-overlay" *ngIf="isLoading">
      <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <ng-container *ngIf="loadAllGames && !isLoading">
      <div class="card" *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p *ngIf="!game.installed">Not downloaded</p>
          <p *ngIf="game.installed"><i class="fa-solid fa-download"></i> Downloaded</p>
          <small>Played : {{ game.playtimeMinutes }}</small>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="loadFavoriteGames && !isLoading">
      <div class="card" *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p *ngIf="!game.installed">Not downloaded</p>
          <p *ngIf="game.installed"><i class="fa-solid fa-download"></i> Downloaded</p>
          <small>Played : {{ game.playtimeMinutes }}</small>
          <button *ngIf="!game.currentlyPlaying && game.installed" class="play-btn"
                  (click)="playGame(game) ; $event.stopPropagation()">
            Play <i class="fa-solid fa-play"></i>
          </button>
          <button *ngIf="game.currentlyPlaying" class="stop-play-btn"
                  (click)="stopPlayingGame(game); $event.stopPropagation()">
            Stop playing <i class="fa-solid fa-xmark"></i>
          </button>
          <button *ngIf="!game.installed" class="download-btn"
                  (click)="downloadGame(game); $event.stopPropagation()">
            Download <i class="fa-solid fa-download"></i>
          </button>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="loadDownloadedGames">
      <div class="card" *ngFor="let game of gamePageResponse.content"
           (click)="goToGame(game.gameId)">
        <img [src]="getGameImageCover(game)" alt="{{game.title}}}">
        <div class="card-content">
          <h3>{{ game.title }}</h3>
          <p *ngIf="!game.installed">Not downloaded</p>
          <p *ngIf="game.installed"><i class="fa-solid fa-download"></i> Downloaded</p>
          <small>Played : {{ game.playtimeMinutes }}</small>
          <button *ngIf="!game.currentlyPlaying && game.installed" class="play-btn"
                  (click)="playGame(game) ; $event.stopPropagation()">
            Play <i class="fa-solid fa-play"></i>
          </button>
          <button *ngIf="game.currentlyPlaying" class="stop-play-btn" (click)="stopPlayingGame(game); $event.stopPropagation()">
            Stop playing <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
    </ng-container>
  </section>

  <app-pagination
    *ngIf="gamePageResponse.totalPages! > 1"
    [currentPage]="page"
    [totalPages]="gamePageResponse.totalPages!"
    (pageChange)="changePage($event)">

  </app-pagination>

</main>
