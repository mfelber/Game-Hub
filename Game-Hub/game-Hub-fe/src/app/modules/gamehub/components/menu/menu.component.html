<div class="flex w-screen h-screen">
  <aside class="sidebar">
    <div class="logo">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-purple-400">Game-Hub</span>
    </div>

    <nav>

      <p>STORE</p>
      <a routerLink="/gamehub" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"> 🏪 Store </a>
      <a routerLink="/gamehub/library" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"> 🎮
        Library </a>
      <a routerLink="/gamehub/wishlist" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"> ❤️
        Wishlist </a>
      <!--        🌐-->
      <p>COMMUNITY</p>
      <a routerLink="/gamehub/community" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">🌐
        Community </a>
      <a routerLink="/gamehub/friends" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">👥
        Friends </a>
      <a *ngIf="friendRequestCount === 0" routerLink="/gamehub/friend-requests" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"> 📩 Friend Requests </a>

      <a *ngIf="friendRequestCount > 0"
         class="menu-item mt-4 px-4 flex items-center gap-3
                     cursor-pointer transition"
         routerLink="/gamehub/friend-requests" routerLinkActive="active"> 📩 Friend Requests

        <span class="absolute top-0 right-7 -mt-1 -mr-1 bg-red-600 text-white text-xs font-bold
                         rounded-full w-5 h-5 flex items-center justify-center">
              {{ friendRequestCount }}
            </span>
      </a>

      <p>Account</p>
      <a routerLink="/gamehub/wallet" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">💰
        Wallet </a>
      <a routerLink="/gamehub/user/me" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">⚙
        Settings </a>

    </nav>

    <div class="profile cursor-pointer" routerLink="/gamehub/user/me">
      <div class="avatar">
        <img *ngIf="!userHasProfilePicture"
             src="../../../../../assets/profilePicture/default_profile_picture.svg"
             class="w-13 h-13 rounded-xl border-1 border-black object-cover"
             [ngStyle]="{'background-color': userResponse.profileColor}"
        />

        <img *ngIf="userHasProfilePicture"
             [src]="getProfilePicture(userResponse)"
             alt="not found"
             class="w-13 h-13 object-cover rounded-xl"
             width="1"
             height="1"
        />
      </div>
      <div>
        <h4>{{ userResponse.username }}</h4>


        <div class="relative">
          <button class="flex items-center gap-2 text-sm cursor-pointer" (click)="toggleStatusMenu($event)">
<span
  class="w-3 h-3 rounded-full"
  [ngClass]="{
            'bg-green-500': statusResponse.status === 'ONLINE',
            'bg-gray-400': statusResponse.status === 'OFFLINE',
            'bg-yellow-400': statusResponse.status === 'AWAY'
        }">
    </span>
            <span
              [ngClass]="{
                'text-green-500': statusResponse.status === 'ONLINE',
                'text-yellow-400': statusResponse.status === 'AWAY',
                'text-gray-400': statusResponse.status === 'OFFLINE'
            }">

            {{statusResponse.status}}

        </span>
            <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
          </button>

          <div
            *ngIf="statusMenuOpen"
            class="absolute left-0 bottom-full mt-2 w-32 bg-[#1b2230] rounded-lg shadow-lg p-2 z-50">

            <button
              *ngFor="let status of statuses"
              class="flex items-center gap-2 w-full px-3 py-2 rounded hover:bg-[#26334a]"
              (click)="changeStatus(status); $event.stopPropagation()">

            <span
              class="w-2.5 h-2.5 rounded-full"
              [ngClass]="{
                    'bg-green-500': status === 'ONLINE',
                    'bg-yellow-400': status === 'AWAY',
                    'bg-gray-400': status === 'OFFLINE'
                }">
            </span>

              <span>
                {{status}}
            </span>

            </button>

          </div>

        </div>

      </div>

    </div>

  </aside>

    <h1>haha</h1>
    <h1>haha</h1>

    <h1>haha</h1>
