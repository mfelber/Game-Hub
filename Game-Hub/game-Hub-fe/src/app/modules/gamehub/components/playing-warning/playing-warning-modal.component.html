<div class="modal-backdrop">
  <div class="change-role-modal">
    <h2>{{ title }}</h2>
    <p>
      <strong class="user-name">{{ game.title }}</strong> is currently running.
      {{description}}
      <br />
    </p>
    <div class="buttons">
      <button class="cancel" (click)="close.emit()">
        Cancel
      </button>

      <button class="stop-play-btn" (click)="stopPlaying(game.gameId)">
        Stop playing <i class="fa-solid fa-stop"></i>
      </button>
    </div>
  </div>
</div>
