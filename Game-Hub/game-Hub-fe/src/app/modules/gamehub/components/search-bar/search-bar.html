<div class="relative w-full">

  <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[#7D879B]"></i>
  <input
         [class]="inputClass"
    [value]="value"
    #searchQuery
    (keyup)="onSearch(searchQuery.value)"
    type="text"
    [placeholder]="placeholder"
    class="min-w-[500px] h-11 w-full rounded-[12px]
  border border-[#222B3D]
  bg-[#151B27]
  pl-10 pr-4
  text-sm text-white
  placeholder:text-[#7D879B]
  outline-none
  transition-all duration-200
  focus:border-[#4DA3FF]
  focus:ring-2 focus:ring-blue-500/15"
    />

</div>
