<div class="relative w-full">

  <input
    [class]="inputClass"
    [value]="value"
    #searchQuery
    (keyup)="onSearch(searchQuery.value)"
    type="text"
    [placeholder]="placeholder"
    class="min-w-[500px] h-11 w-full rounded-[12px]
  border border-[#222B3D]
  bg-[#151B27]
  pl-3 pr-4
  text-sm text-white
  placeholder:text-[#7D879B]
  outline-none
  transition-all duration-200
  focus:border-blue-500
  focus:ring-4 focus:ring-blue-500/15"
  />

</div>
