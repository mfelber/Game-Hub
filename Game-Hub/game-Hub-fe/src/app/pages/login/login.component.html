<main>
  <div class="auth-page">

    <div class="auth-container">

      <!-- LEFT SIDE -->
      <section class="auth-form">

        <img ngSrc="joystick.png"
             alt="GameHub Logo"
             class="logo"
             width="80"
             height="80"/>

        <h1>Welcome back</h1>

        <p class="subtitle">
          Sign in to access your launcher and games
        </p>

        <div *ngIf="errorMessage" class="error">
          {{ errorMessage }}
        </div>

        <form>

          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input [(ngModel)]="authenticationRequest.email"
                   type="email"
                   name="email"
                   placeholder="Email"/>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input [(ngModel)]="authenticationRequest.password"
                   type="password"
                   name="password"
                   placeholder="Password"/>
          </div>

          <div class="options">
            <label>
              <input type="checkbox">
              Remember me
            </label>

            <button type="button" (click)="resetPassword()">
              Forgot Password?
            </button>
          </div>

          <button
            type="submit"
            (click)="login()"
            class="login-btn">
            Login
            <i class="fa-solid fa-arrow-right"></i>
          </button>

          <p class="register-text">
            Don't have account?
            <button type="button" (click)="register()">
              Register
            </button>
          </p>

        </form>

      </section>

      <!-- RIGHT SIDE -->
      <section class="astronaut">

        <img ngSrc="assets/images/astronaut_logIn.svg"
             alt="Astronaut"
             width="700"
             height="700"/>

      </section>
    </div>
  </div>
</main>
