<main class="min-h-screen bg-[#0B0F14] text-white">
  <div class="flex min-h-screen items-center justify-center p-6">
    <div class="w-full max-w-md rounded-3xl border border-[#242a38] bg-[#151923] px-10 py-12 shadow-2xl">

      <div class="flex items-center justify-center">
        <img src="assets/images/gamehub-logo.png" class="h-50 w-auto" alt="GameHub">
      </div>


      <h1 class="text-center text-4xl font-bold tracking-tight">Welcome back</h1>
      <p class="mt-2 text-center text-[#76849D]">Sign in to acces your games</p>

      @if (errorMessage) {
        <div class="mt-6 rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-400">
          {{ errorMessage }}
        </div>
      }

      <form class="mt-8 space-y-3">

          <hlm-input-group class="
          !h-auto !rounded-lg !border-[#2A3445] !bg-[#151C2B]
          !outline-none !ring-0 focus-within:!border-[#155dfc]
          focus-within:!outline-none focus-within:!ring-0
        autofill:!bg-[#151C2B]
        autofill:!text-white">
            <input
              hlmInputGroupInput
              type="email"
              name="email"
              placeholder="Email"
              [(ngModel)]="authenticationRequest.email"
              class="!py-5 !text-white placeholder:!text-[#596579] mb-1"/>
            <hlm-input-group-addon>
              <i class="fa-solid fa-envelope"></i>
            </hlm-input-group-addon>
          </hlm-input-group>

          <hlm-input-group class="
          !h-auto !rounded-lg !border-[#2A3445] !bg-[#151C2B]
          !outline-none !ring-0 focus-within:!border-[#155dfc]
          focus-within:!outline-none focus-within:!ring-0">
            <input
              hlmInputGroupInput
              type="password"
              name="password"
              placeholder="Password"
              [(ngModel)]="authenticationRequest.password"
              class="!py-5 !text-white placeholder:!text-[#596579] mb-1"/>
            <hlm-input-group-addon>
              <i class="fa-solid fa-lock"></i>
            </hlm-input-group-addon>
          </hlm-input-group>

        <div class="flex items-center justify-between text-sm">

          <label class="flex cursor-pointer items-center gap-2 text-[#76849D]">
            <input
              type="checkbox"
              class="w-4 h-4 ronded border-[#3A4354] bg-[#151C2B]"
            />
            Remember me
          </label>

          <button
            type="button"
            (click)="resetPassword()"
            class="cursor-pointer text-[#155dfc] transition hover:text-white">
            Forgot Password?
          </button>
        </div>

        <button
          type="submit"
          (click)="login()"
          class="big-btn-w-full save">
          Login
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p class="pt-2 text-center text-sm text-[#76849D]">
          Don't have an account?
          <button
            type="button"
            (click)="register()"
            class="ml-1 cursor-pointer font-medium text-[#155dfc] hover:text-white">
            Register
          </button>
        </p>
      </form>
    </div>
  </div>
</main>
